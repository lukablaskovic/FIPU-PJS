name: Sync course materials to Google Drive

on:
  push:
    branches: [main]
    paths:
      - '[1-5]. */**'
      - 'images/**'
      - '0. Template/**'
      - 'Makefile'
      - '.githooks/**'
      - 'script-patcher/**'
      - '.github/workflows/sync-drive.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pjs-google-drive-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: script-patcher/requirements.txt
      - name: Check file selection and update planning
        run: |
          python script-patcher/test_sync.py
          python .githooks/test_dates.py
      - name: Install dependencies
        run: python -m pip install -r script-patcher/requirements.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: script-patcher/package-lock.json
      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc fonts-dejavu-core fonts-noto-color-emoji
          npm ci --prefix script-patcher
          script-patcher/node_modules/.bin/playwright install --with-deps chromium --only-shell
      - name: Check PDF assets
        run: npm test --prefix script-patcher
      - name: Generate PDFs from Markdown
        run: npm run pdf --prefix script-patcher
      - name: Check main has not changed during generation
        run: |
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)" || {
            echo 'main changed while generating PDFs. Run the workflow again for the latest main.'
            exit 1
          }
      - name: Upload changed Markdown and PDF files
        env:
          GOOGLE_DRIVE_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
        run: python -u script-patcher/index.py
      - name: Commit PDFs after successful Drive upload
        run: |
          python - <<'PY'
          import subprocess, sys
          sys.path.insert(0, 'script-patcher')
          from index import course_files
          subprocess.run(['git', 'add', '--', *[str(p) for p in course_files() if p.suffix == '.pdf']], check=True)
          PY
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update generated course PDFs'
          git push origin HEAD:main
